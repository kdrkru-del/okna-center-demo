<script>
(() => {
 const removeLabels=['Лаборатория ремонта «ОКНА-ЦЕНТР»','Философия алюминиевого остекления','База знаний • Экспертиза','Наши услуги','О компании','Подбор параметров','Фото работ','Отзывы клиентов','Контакты и заявка','Комплексный подход','Почему промерзает фасад','Простое и элегантное инженерное решение','Написать инженеру в WhatsApp →'];
 const replaceText=[['Утепление алюминиевого остекления','Утепление и шумоизоляция алюминиевого остекления'],['Обсудить утепление','Обсудить утепление и шумоизоляцию'],['утепление алюминиевого остекления','утепление и шумоизоляция алюминиевого остекления'],['Утепление угловой лоджии','Утепление и шумоизоляция угловой лоджии'],['Утепление и шумоизоляция в одном решении','Утепление, шумоизоляция'],['Написать в WhatsApp (+7 914 072-22-22)','Написать в WhatsApp'],['Подготовить и отправить запрос','Отправить заявку'],['Запрос на расчет и выезд специалиста','Оставьте имя и телефон'],['от 4 900 ₽ · материалы и работа / пог. м','от 4 900 ₽ / пог. м · материалы и работа'],['Материал и работа — от 4 900 ₽ за погонный метр. Точная стоимость после замера.','От 4 900 ₽ / пог. м, материалы и работа включены. Точная стоимость после замера.']];
 const clean=()=>{
  document.getElementById('calculator')?.remove();
  const contactGrid=document.querySelector('#contacts .grid');if(contactGrid){contactGrid.style.maxWidth='1024px';contactGrid.style.margin='56px auto 0';contactGrid.style.gridTemplateColumns=window.innerWidth>=1024?'repeat(2,minmax(0,1fr))':'1fr';contactGrid.style.alignItems='stretch';[...contactGrid.children].forEach(col=>{col.classList.remove('lg:col-span-5','lg:col-span-7');col.style.height='100%';const card=col.firstElementChild;if(card){card.style.height='100%';card.style.boxSizing='border-box';}});}
  document.querySelector('[data-price-note]')?.remove();
  const caption=[...document.querySelectorAll('p')].find(el=>el.textContent.trim()==='Панорамный фасад • Владивосток');
  const card=caption?.closest('.group') || caption?.parentElement?.parentElement;
  if(card&&card.parentElement&&!card.parentElement.querySelector('[data-price-badge]')){
   const badge=document.createElement('div');badge.dataset.priceBadge='true';badge.style.marginTop='20px';badge.className='inline-flex items-center justify-center rounded-xl border border-gray-200 bg-gray-100 px-6 py-3.5 text-sm font-bold text-gray-700 whitespace-nowrap min-h-[44px]';badge.textContent='от 4 900 ₽ / пог. м · материалы и работа';card.parentElement.insertBefore(badge,card.nextSibling);
  }
  document.querySelectorAll('img').forEach(img=>{const src=img.getAttribute('src')||'';if(src.includes('9f991d9ed587b3a675f00bdc4a683a48.jpg'))img.src=src.replace('9f991d9ed587b3a675f00bdc4a683a48.jpg','3d9c4d3c3712c7309fa326580a74ccca.jpg');});
  document.querySelectorAll('button').forEach(b=>{if(b.textContent.trim()==='Замер'){const a=document.createElement('a');a.href='tel:+79140722222';a.className='md:hidden inline-flex items-center gap-1 px-2 py-2 text-xs font-bold text-sky-700 bg-sky-50 border border-sky-200 rounded-lg min-h-[40px] whitespace-nowrap';a.textContent='+7 914 072-22-22';b.replaceWith(a);}});
  document.querySelectorAll('label').forEach(label=>{const t=label.textContent.trim();if(['Email (для отправки сметы)','Тип объекта','Удобный способ связи','Комментарий / Адрес во Владивостоке'].includes(t))label.parentElement?.remove();});
  const walker=document.createTreeWalker(document.getElementById('root'),NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(node=>{let v=node.nodeValue;replaceText.forEach(([from,to])=>{v=v.split(from).join(to);});v=v.replace(/шумоизоляцию( и шумоизоляцию)+/g,'шумоизоляцию').replace(/шумоизоляция( и шумоизоляция)+/g,'шумоизоляция');if(v!==node.nodeValue)node.nodeValue=v;});
  document.querySelectorAll('div,span,a').forEach(el=>{const t=el.textContent.trim();if(removeLabels.includes(t))el.remove();if(/^0[1-5]$/.test(t))el.textContent='→';if(/^Шаг\s+\d+\s+из\s+5$/.test(t))el.remove();});
 };
 new MutationObserver(clean).observe(document.getElementById('root'),{childList:true,subtree:true});clean();
})();
